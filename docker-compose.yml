services:
  # 1. MongoDB Database Container
  mongodb:
    image: mongo:7.0
    container_name: fleetflow_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fleet_management
    volumes:
      - mongo_data:/data/db
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache Container
  redis:
    image: redis:7-alpine
    container_name: fleetflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Node.js + Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetflow_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/fleet_management
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=super_secret_fleetflow_jwt_token_2026_secure
      - JWT_EXPIRE=7d
      - CACHE_TTL_SECONDS=300
      - AUTO_SEED_IF_EMPTY=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fleet-network

  # 4. React.js Frontend (Nginx Production Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleetflow_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fleet-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  fleet-network:
    driver: bridge
